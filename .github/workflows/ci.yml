name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Matches config/database.yml, which hardcodes these credentials
          # for local/CI use rather than reading them from ENV.
          POSTGRES_USER: ropegun
          POSTGRES_PASSWORD: gargoyle
          POSTGRES_DB: ropegun_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      RAILS_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.3" # matches Gemfile; repo's .ruby-version is stale (3.0.3)
          bundler-cache: true

      - name: Set up database
        run: bin/rails db:schema:load

      - name: Run backend tests
        run: bin/rails test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run frontend tests
        run: yarn test
